name: RETRADE CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check workflow-system.js
          node --check surface-ownership.js
          node --check interaction-health.js
          node --check workflow-qol.js
          node --check listing-flow.js
          node --check chart-polish.js
          node --check chart-motion.js
          node --check chart-finalize.js
          node --check chart-reveal.js
          node --check chart-line-motion.js
          node --check motion-system.js
          node --check fab-system.js
          node --check dashboard-details.js
          node --check stock-detail-profit.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch archive/legacy-site/data.json >/dev/null 2>&1; then
            echo "archive/legacy-site/data.json must not be tracked"
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.env($|\.)|retrade-(backup|export).*\.json$|.*\.backup\.json$)' ; then
            echo "Potential local secret/business-data backup is tracked"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text=p.read_text(encoding='utf-8')
              if re.search(r'contents\s*:\s*write', text):
                  failures.append(f'{p}: contents: write')
              if re.search(r'(^|\s)git\s+push(\s|$)', text):
                  failures.append(f'{p}: git push')
          if failures:
              raise SystemExit('Unsafe repository-writing workflow detected:\n'+'\n'.join(failures))
          print('Workflow write-safety check passed')
          PY

      - name: Motion performance guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          surface=Path('surface-ownership.js').read_text(encoding='utf-8')
          line=Path('chart-line-motion.js').read_text(encoding='utf-8')
          chart=Path('chart-motion.js').read_text(encoding='utf-8')
          motion=Path('motion-system.js').read_text(encoding='utf-8')
          global_style_pattern="observer.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style'"
          assert global_style_pattern not in surface, 'surface ownership must not observe global style mutations'
          assert global_style_pattern not in line, 'line motion must not observe global style mutations'
          assert 'state.rafs' not in line, 'Sales line motion must use one shared rAF timeline, not per-element rAF arrays'
          assert "fill.style.width='0%'" not in chart, 'Money Flow must not animate layout width from zero'
          assert 'sequenceDelay=660' not in chart, 'Money Flow must not reintroduce delayed value presentation'
          assert 'animateValue(' not in chart, 'Money Flow values should render final figures immediately, not JS count-up'
          assert 'rtPageEnterV1450 110ms' in motion, 'page switch motion must remain short and immediate'
          print('Motion performance guardrails passed')
          PY

      - name: Interaction hit-test health
        run: |
          python - <<'PY'
          from pathlib import Path

          health=Path('interaction-health.js').read_text(encoding='utf-8')
          assert "wrap('closeMoreSheet'" in health, 'More-sheet close must release hit-testing synchronously'
          assert "wrap('toggleMoreSheet'" in health, 'More-sheet open/close semantics must stay explicit'
          assert "wrap('closeAllCategoriesModal'" in health, 'closing category drawer must release hit-testing before animation removal'
          assert "el.style.pointerEvents='none'" in health, 'closed visual surfaces must leave the hit-test path immediately'
          assert "setAttribute('aria-hidden','true')" in health, 'closing surfaces must become semantically closed immediately'
          assert '__RT_SURFACE_OWNERSHIP.reconcile' in health, 'surface ownership must be reconciled in the same task as close'
          assert 'semanticScrollLockCount' in health and 'reconcileScrollLocks' in health, 'popup close must reconcile the body scroll-lock reference count'
          assert "['closePanel','closeModal','resolveConfirm','_closeSaleModal']" in health, 'all synchronous popup closers must reconcile scroll locks'
          assert "b.style.position=''" in health and "b.style.overflow=''" in health, 'orphaned popup locks must restore body scrolling'
          assert 'new MutationObserver' not in health, 'interaction health must not add a global mutation observer/polling loop'
          assert "visibilitychange" in health and "addEventListener('scrollend'" in health, 'iOS background/scroll-end recovery hooks must remain'
          assert "addEventListener('pointerdown',heal" not in health, 'normal taps must never run recovery DOM scans before navigation'
          assert "addEventListener('touchstart',heal" not in health, 'normal touches must never run recovery DOM scans before navigation'
          assert "addEventListener('scroll'," not in health, 'active scrolling must not schedule repeated recovery scans'
          print('Interaction hit-test guardrails passed')
          PY

      - name: Listing flow coherence
        run: |
          python - <<'PY'
          from pathlib import Path

          listing=Path('listing-flow.js').read_text(encoding='utf-8')
          assert "List Item — locked" in listing and "'List Item'" in listing, 'listing submit copy must say List Item, never Add Item'
          assert 'submitQuickAdd' in listing and 'submitListFromSourced' in listing, 'both generic and sourced listing routes must share the same semantics'
          assert '__RT_INTERACTION_HEALTH.reconcileScrollLocks' in listing, 'successful popup -> listing transitions must verify body scroll release'
          assert '__RT_SURFACE_OWNERSHIP.reconcile' in listing, 'successful listing transitions must release stale popup ownership'
          print('Listing flow guardrails passed')
          PY

      - name: Persistent bottom action shell
        run: |
          python - <<'PY'
          from pathlib import Path

          fab=Path('fab-system.js').read_text(encoding='utf-8')
          assert '_FAB_HIDDEN_PAGES.clear' in fab, 'app pages must not deliberately suppress the shell FAB'
          assert "['list','sourced','sourcerun','expense','trip']" in fab, 'unmapped pages need the universal Command Centre launcher'
          assert 'nativeOptions.call(this,pageId)' in fab and 'return fallback();' in fab, 'context actions stay first, universal fallback handles unmapped routes'
          assert "_syncFabVisibility=function(){keepShellMounted();}" in fab, 'page visibility sync must never hide/reveal the shell'
          assert '#bottom-nav.nav-hidden{transform:none!important' in fab, 'legacy nav-hidden must not visually control the shell after programmatic scroll restore'
          assert 'rt-shell-scroll-hidden' in fab and 'setScrollCollapsed' in fab, 'visual collapse must have a dedicated user-scroll state'
          assert "addEventListener('touchmove',beginUserScroll" in fab and "addEventListener('wheel',beginUserScroll" in fab, 'collapse must be armed by a real user scroll gesture'
          assert "addEventListener('scroll',function()" in fab and 'requestAnimationFrame(processUserScroll)' in fab, 'trusted scroll sessions must update cheaply on one rAF path'
          assert 'if(routeActive||!userScrollActive)' in fab, 'programmatic route scroll restoration must never collapse the shell'
          assert 'beginRouteHandoff' in fab and 'setScrollCollapsed(false)' in fab, 'route changes must synchronously restore the shell before scrolling/rendering'
          assert 'translateY(150%)' in fab and 'opacity:0!important' in fab, 'genuine user scroll collapse must still move FAB/search out cleanly'
          assert 'new MutationObserver' not in fab, 'FAB shell must not watch style/class mutations during scrolling'
          print('Route-stable, trusted-scroll bottom shell guardrails passed')
          PY

      - name: Dashboard drill coherence
        run: |
          python - <<'PY'
          from pathlib import Path

          details=Path('dashboard-details.js').read_text(encoding='utf-8')
          assert 'showGrossRevenueBreakdown' in details, 'Gross Revenue must have an exact dashboard breakdown'
          assert 'showGrossProfitBreakdown' in details, 'Gross Profit must have an exact dashboard breakdown'
          assert 'showGrossMarginBreakdown' in details, 'Gross Margin must have an exact dashboard breakdown'
          assert 'revenue-weighted overall margin' in details, 'Gross Margin must remain weighted profit / revenue, not average item margin'
          assert "h.fn!=='showMonthSnapshot'" in details and "h.fn='showRangeSnapshot'" in details, 'FY chart months must normalize to exact datapoint ranges'
          assert 'exactIndexFromClick' in details and 'stopImmediatePropagation' in details, 'chart taps must own their exact X-position and not fall through to the mobile hero card'
          assert "closest('#summary-chart-svg,#summary-chart-svg-mobile')" in details, 'metric-card routing must not steal chart taps'
          print('Dashboard drill coherence guardrails passed')
          PY

      - name: Sourced stock estimate coherence
        run: |
          python - <<'PY'
          from pathlib import Path

          detail=Path('stock-detail-profit.js').read_text(encoding='utf-8')
          assert '_estPotentialNet' in detail, 'sourced panel profit must reuse the canonical expected-profit estimate'
          assert '_estPartnerCut' in detail, 'partner/consignment estimated share must be represented in sourced profit'
          assert 'Est. Profit' in detail, 'sourced panel must expose an explicit estimated-profit token'
          assert "'✎ Tap to edit'" in detail, 'Est. Sale helper must not masquerade as a naive profit number'
          assert 'refreshPanelParts' in detail, 'inline parts changes must refresh estimated profit immediately'
          assert "observer.observe(panel,{childList:true,subtree:true,characterData:true})" in detail, 'estimate edits must stay live without observing global style mutations'
          print('Sourced stock estimate coherence guardrails passed')
          PY

      - name: Runtime asset hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          entry=Path('app.js').read_text(encoding='utf-8')
          assets={
              'core':'app-core.js',
              'workflow':'workflow-system.js',
              'surface':'surface-ownership.js',
              'interaction':'interaction-health.js',
              'qol':'workflow-qol.js',
              'listing':'listing-flow.js',
              'polish':'chart-polish.js',
              'chartMotion':'chart-motion.js',
              'finalize':'chart-finalize.js',
              'reveal':'chart-reveal.js',
              'line':'chart-line-motion.js',
              'motion':'motion-system.js',
              'fab':'fab-system.js',
              'dashboard':'dashboard-details.js',
              'stockDetail':'stock-detail-profit.js',
          }
          for key,path in assets.items():
              match=re.search(rf"\b{re.escape(key)}:'([a-f0-9]{{8}})'",entry)
              assert match, f'missing content hash for {path} in app.js'
              data=Path(path).read_bytes()
              actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()[:8]
              assert match.group(1)==actual, f'{path} cache hash is stale: app.js={match.group(1)} actual={actual}'
          print('Runtime asset hash map matches Git blobs')
          PY

      - name: Core file references
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          entry=Path('app.js').read_text(encoding='utf-8')
          for required in ('app.js','app.css'):
              assert required in index, f'{required} is not referenced by index.html'
          for required in ('workflow-system.js','surface-ownership.js','interaction-health.js','workflow-qol.js','listing-flow.js','chart-line-motion.js','motion-system.js','fab-system.js','dashboard-details.js','stock-detail-profit.js'):
              assert required in entry, f'{required} is not loaded by app.js'
          print('Core file reference check passed')
          PY
