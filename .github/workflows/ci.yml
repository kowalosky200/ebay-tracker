name: RETRADE CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check workflow-system.js
          node --check surface-ownership.js
          node --check workflow-qol.js
          node --check chart-polish.js
          node --check chart-motion.js
          node --check chart-finalize.js
          node --check chart-reveal.js
          node --check chart-line-motion.js
          node --check motion-system.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch archive/legacy-site/data.json >/dev/null 2>&1; then
            echo "archive/legacy-site/data.json must not be tracked"
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.env($|\.)|retrade-(backup|export).*\.json$|.*\.backup\.json$)' ; then
            echo "Potential local secret/business-data backup is tracked"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text=p.read_text(encoding='utf-8')
              if re.search(r'contents\s*:\s*write', text):
                  failures.append(f'{p}: contents: write')
              if re.search(r'(^|\s)git\s+push(\s|$)', text):
                  failures.append(f'{p}: git push')
          if failures:
              raise SystemExit('Unsafe repository-writing workflow detected:\n'+'\n'.join(failures))
          print('Workflow write-safety check passed')
          PY

      - name: Motion performance guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          surface=Path('surface-ownership.js').read_text(encoding='utf-8')
          line=Path('chart-line-motion.js').read_text(encoding='utf-8')
          global_style_pattern="observer.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style'"
          assert global_style_pattern not in surface, 'surface ownership must not observe global style mutations'
          assert global_style_pattern not in line, 'line motion must not observe global style mutations'
          assert 'state.rafs' not in line, 'Sales line motion must use one shared rAF timeline, not per-element rAF arrays'
          print('Motion performance guardrails passed')
          PY

      - name: Runtime asset hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          entry=Path('app.js').read_text(encoding='utf-8')
          assets={
              'core':'app-core.js',
              'workflow':'workflow-system.js',
              'surface':'surface-ownership.js',
              'qol':'workflow-qol.js',
              'polish':'chart-polish.js',
              'chartMotion':'chart-motion.js',
              'finalize':'chart-finalize.js',
              'reveal':'chart-reveal.js',
              'line':'chart-line-motion.js',
              'motion':'motion-system.js',
          }
          for key,path in assets.items():
              match=re.search(rf"\b{re.escape(key)}:'([a-f0-9]{{8}})'",entry)
              assert match, f'missing content hash for {path} in app.js'
              data=Path(path).read_bytes()
              actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()[:8]
              assert match.group(1)==actual, f'{path} cache hash is stale: app.js={match.group(1)} actual={actual}'
          print('Runtime asset hash map matches Git blobs')
          PY

      - name: Core file references
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          entry=Path('app.js').read_text(encoding='utf-8')
          for required in ('app.js','app.css'):
              assert required in index, f'{required} is not referenced by index.html'
          for required in ('workflow-system.js','surface-ownership.js','workflow-qol.js','chart-line-motion.js','motion-system.js'):
              assert required in entry, f'{required} is not loaded by app.js'
          print('Core file reference check passed')
          PY
